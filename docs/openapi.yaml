openapi: 3.1.0
info:
  title: MusMove Mobile API
  version: 1.1.0
  description: Offline-first MusMove API. Private data endpoints require a short-lived verified Neon JWT; cookies are not authentication. Native auth is proxied through /auth endpoints with an encrypted Session credential distinct from the Bearer JWT. Production shared limits apply (IP180/min, account120/min, mutations30/min, scans5/min, bootstrap5/min, demo import2/10min); auth has additional dedicated IP limits.429 includes Retry-After, unavailable protection returns503. JSON bodies at most1MiB (auth8KiB), depth32; operation/import payloads64KiB, response3MiB. See docs/security-vercel.md and docs/frontend-follow-up-auth-proxy.md.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /programs/custom:
    $ref: "./openapi-online.json#/paths/~1programs~1custom"
  /programs/custom/{id}:
    $ref: "./openapi-online.json#/paths/~1programs~1custom~1{id}"
  /exercises/custom:
    $ref: "./openapi-online.json#/paths/~1exercises~1custom"
  /exercises/custom/{id}:
    $ref: "./openapi-online.json#/paths/~1exercises~1custom~1{id}"
  /social/drafts:
    $ref: "./openapi-online.json#/paths/~1social~1drafts"
  /social/drafts/{id}:
    $ref: "./openapi-online.json#/paths/~1social~1drafts~1{id}"
  /meals/{id}:
    $ref: "./openapi-online.json#/paths/~1meals~1{id}"
  /places/{id}/favorite:
    $ref: "./openapi-online.json#/paths/~1places~1{id}~1favorite"
  /workouts/{id}:
    $ref: "./openapi-online.json#/paths/~1workouts~1{id}"
  /dashboard:
    $ref: "./openapi-online.json#/paths/~1dashboard"
  /schedule:
    $ref: "./openapi-online.json#/paths/~1schedule"
  /statistics:
    $ref: "./openapi-online.json#/paths/~1statistics"
  /auth/sign-up/email:
    post:
      operationId: nativeAuthSignUp
      security: []
      description: Register via the pinned Neon upstream. No Authorization or query parameters.10 attempts/10min/IP plus provider limits. No callbackURL is sent upstream; native navigation is client-owned. Origin is server-owned; callbackURL, rememberMe, role and arbitrary upstream request fields are rejected. Provider JSON redirect/twoFactorRedirect flags are not authentication decisions; a live matching provider session and allowlisted cookie are required for authenticated status. Verification policy unchanged. HTTP200 does not guarantee a session or delivered email; inspect status. Credentials are not stored in application tables or logged. Mutations may have succeeded on upstream timeout; try sign-in before retrying registration.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NativeAuthSignUp" }
      responses:
        "200":
          description: Session established, or verification/sign-in required without a session.
          content:
            application/json:
              schema:
                oneOf: [{ $ref: "#/components/schemas/NativeAuthSession" }, { $ref: "#/components/schemas/NativeAuthNoSession" }]
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/sign-in/email:
    post:
      operationId: nativeAuthSignIn
      security: []
      description: Email/password login through Next.js. No Authorization or query.10 attempts/10min/IP. No callbackURL sent upstream and no browser redirect. Provider JSON redirect/twoFactorRedirect flags are ignored; authentication still requires a valid allowlisted cookie and live matching unexpired session. No 2FA endpoints are implemented. Actual HTTP redirects remain forbidden and Location is never forwarded. Returns an encrypted native session, NOT an access JWT or provider cookie. Store sessionToken securely; use /auth/token next, then /me. Error messages are sanitized.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NativeAuthSignIn" }
      responses:
        "200":
          description: Authenticated session. No Set-Cookie or upstream headers are forwarded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NativeAuthSession" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/get-session:
    get:
      operationId: nativeAuthGetSession
      security: [{ nativeSession: [] }]
      description: No query/body.60 attempts/min/IP. Checks the live provider session with the allowlisted encrypted cookie, not just envelope validity. Always replace stored sessionToken atomically from successful replies; use single-flight with /auth/token to avoid rotation races.401 AUTH_SESSION_INVALID means sign-in again; never erase offline data on transient network errors.
      responses:
        "200":
          description: Restored user and renewed session envelope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NativeAuthSession" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/token:
    get:
      operationId: nativeAuthGetAccessToken
      security: [{ nativeSession: [] }]
      description: No query/body.60 attempts/min/IP. Checks live provider session and verifies upstream JWT signature/issuer/audience/claims and subject before returning accessToken for private DATA APIs. Does not create the application user mapping; /me does that. Session header is not a Bearer JWT. Store the new sessionToken too; sessionExpiresAt is not JWT expiry.
      responses:
        "200":
          description: Short-lived access JWT and updated native session envelope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NativeAuthTokens" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/sign-out:
    post:
      operationId: nativeAuthSignOut
      security: [{ nativeSession: [] }]
      description: No body (not even empty JSON) or query.60 attempts/min/IP. Requires provider acknowledgment before returning signed_out. Only current session, no admin operations. Local logout during network failure is not proof of provider revocation. Already-issued access JWTs may remain usable until expiry.
      responses:
        "200":
          description: Provider acknowledged logout.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: signed_out }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/request-password-reset:
    post:
      operationId: nativeAuthRequestPasswordReset
      security: []
      description: Email only; no Authorization/query.5 attempts/10min/IP. Callback is AUTH_PUBLIC_ORIGIN plus /auth/reset-password; redirectTo from client rejected. Generic acceptance is not confirmation of account existence or email delivery. Existing web callback completes reset; no native verification/OAuth flow added.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "200":
          description: Generic acknowledgment; email delivery depends on provider configuration.
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status: { const: accepted }
                  message: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/mobile:
    servers: [{ url: / }]
    get:
      operationId: nativeAuthLandingPage
      security: []
      description: Legacy root web landing page retained for existing links, NOT /api/v1/auth/mobile. New signup/login no longer send callbackURL or use this page. Simply asks user to return to app and sign in. No arbitrary redirect, session exchange, query echo, OAuth, or new email-verification implementation.
      responses:
        "200":
          description: No-store minimal HTML.
          content:
            text/html:
              schema: { type: string }
  /meta:
    get:
      operationId: getApiCapabilities
      security: []
      description: Public API version/capabilities and social publishing flag only; no credentials or private account data. Capabilities describe source implementation, not provider/email/AI readiness. Operational deletion worker requires deployed identity-guard capability before purging. Older deployments may404; mobile can keep its legacy sync fallback.
      responses:
        "200":
          description: apiVersion1.1.0, implementation capabilities and socialPublishingEnabled.
          content:
            application/json:
              schema:
                type: object
                required: [apiVersion, capabilities, socialPublishingEnabled]
                properties:
                  apiVersion: { const: "1.1.0" }
                  capabilities: { type: object, additionalProperties: { type: boolean } }
                  socialPublishingEnabled: { type: boolean }
  /sync/snapshots:
    post:
      operationId: startSyncSnapshot
      description: Additive v2 bootstrap. Materializes an immutable snapshot and pins a v1 change-stream position in one transaction. Client-generated snapshotId makes start retries idempotent. TTL30 minutes, at most2 active snapshots/account,20000 live entities/32MiB. Does not clear local outbox; legacy bootstrap remains unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [snapshotId]
              properties:
                snapshotId: { type: string, format: uuid }
      responses:
        "200":
          description: Snapshot start metadata; no sync cursor yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncSnapshotMetadata" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    get:
      operationId: readSyncSnapshotPage
      description: Read/replay an account-owned immutable page. Keyset page cursor is signed and bound to snapshot/account. Store pages in local staging tables, preserving outbox. Only complete=true returns syncCursor; atomically install the complete snapshot and that cursor, then pull all changes after it. Page budget2MiB. Expired/missing/wrong-account/changed-epoch snapshots return409 SNAPSHOT_EXPIRED; restart with a new ID without discarding pending edits.
      parameters:
        - { in: query, name: snapshotId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: cursor, schema: { type: string, maxLength: 2048 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: Immutable page; cursor for next page or final sync handoff.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncSnapshotPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: releaseSyncSnapshot
      description: Idempotent release of own temporary snapshot after local commit or abandonment. Does not modify user history or invalidate an already issued syncCursor.
      parameters:
        - { in: query, name: snapshotId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Released; status released. }
        "401": { $ref: "#/components/responses/Error" }
  /social/posts:
    get:
      operationId: readCommunityFeed
      description: Authenticated text community feed, not private social_draft. Returns only visible/non-deleted explicit publications from active authors. No email, internal userId, profile health data or reports. Disabled with403 SOCIAL_NOT_ENABLED until SOCIAL_PUBLISHING_ENABLED=true and moderation is operational. Treat body and authorLabel as plain text, never HTML.
      parameters:
        - { in: query, name: cursor, schema: { type: string, maxLength: 2048 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: Newest first keyset feed; concurrent new posts appear on refresh, not necessarily during an older pagination traversal.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  nextCursor: { type: [string, "null"] }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CommunityPost" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: publishCommunityPost
      description: Explicit publication outside offline sync. Body/publish/authorLabel required; no draft auto-publication. postId is the idempotency key; retry unchanged input, never reuse for different content. 3 attempts/10min per account in addition to general limits. No media/comments/likes/edit in this version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [postId, publish, authorLabel, body]
              properties:
                postId: { type: string, format: uuid }
                publish: { const: true }
                authorLabel: { type: string, minLength: 1, maxLength: 80, description: User-chosen public alias; no control characters. Not a verified identity. }
                body: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "201":
          description: Published or identical retry acknowledged.
          content:
            application/json:
              schema:
                type: object
                required: [postId, publishedAt, duplicate]
                properties:
                  postId: { type: string, format: uuid }
                  publishedAt: { type: string, format: date-time }
                  duplicate: { type: boolean }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteOwnCommunityPost
      description: Owner-only and idempotent. Erases body/alias, retains minimal tombstone to prevent delayed publication retries from resurrecting it. Another account receives404 POST_NOT_FOUND. Available even if publishing is disabled.
      parameters:
        - { in: query, name: postId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: status deleted. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /social/reports:
    post:
      operationId: reportCommunityPost
      description: Private report to operator, never returned in feed. At most one stored report/account/post. Repeats acknowledge without changing the first report.10 attempts/10min/account. Own posts should be deleted instead. No public moderation/admin role parameter is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [postId, reason]
              properties:
                postId: { type: string, format: uuid }
                reason: { type: string, enum: [spam, harassment, unsafe_content, privacy, other] }
                details: { type: [string, "null"], maxLength: 1000, default: null }
      responses:
        "202": { description: status received and duplicate boolean. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/reset-password:
    servers: [{ url: / }]
    get:
      operationId: passwordResetWebCallback
      security: []
      description: Root web callback, NOT /api/v1/auth/reset-password. No external scripts/analytics; no-store, nonce CSP, no-referrer. Browser consumes provider reset capability from query, removes it from history, and asks for a new password. Not an email verification page or a mobile JWT callback.
      responses:
        "200":
          description: Minimal reset-password HTML page.
          content:
            text/html:
              schema: { type: string }
    post:
      operationId: completePasswordReset
      security: []
      description: Same-origin reset form proxy to pinned Neon Auth reset-password endpoint. Capability token required, no mobile JWT/admin cookie forwarded.5 attempts/10min/IP. Provider SMTP/redirect allowlist must be configured separately; no reset email is sent by this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, newPassword]
              properties:
                token: { type: string, minLength: 8, maxLength: 2048 }
                newPassword: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
      responses:
        "200": { description: status password_changed. Return to mobile sign-in; no JWT returned. }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /catalog/equipment:
    get:
      operationId: getEquipmentCatalog
      security: []
      description: Canonical equipment IDs/names/aliases and nonempty training modes from the database. Optional mode filters before name search; shared tools appear in both modes. Exact normalized aliases resolve as exact; partial results require selection. Initial 28 tools. Modes classify training use, not venue availability or exercise eligibility. See docs/equipment-scan.md.
      parameters:
        - { in: query, name: q, schema: { type: string, minLength: 2, maxLength: 120 } }
        - { in: query, name: mode, schema: { type: string, enum: [gym, calisthenics] } }
      responses:
        "200":
          description: Versioned catalog or name-search candidates.
          content:
            application/json:
              schema:
                type: object
                required: [catalogVersion, matchType, equipment]
                properties:
                  catalogVersion: { $ref: "#/components/schemas/DecimalVersion" }
                  matchType: { type: string, enum: [catalog, exact, candidates, no_match] }
                  equipment: { type: array, items: { $ref: "#/components/schemas/EquipmentItem" } }
        "400": { $ref: "#/components/responses/Error" }
  /equipment/exercises:
    get:
      operationId: getEquipmentExercises
      security: []
      description: Related exercises grouped by complete equipment requirements vs missing tools. Inner requirement arrays are AND groups, outer arrays are OR alternatives. Equipment match is not personalized workout advice. Mat is optional and currently has no explicit required-exercise mappings.
      parameters:
        - in: query
          name: equipmentIds
          required: true
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 32
            uniqueItems: true
            items: { type: string, pattern: "^[a-z][a-z0-9_]{0,79}$" }
        - { in: query, name: mode, schema: { type: string, enum: [gym, calisthenics] } }
      responses:
        "200":
          description: Current catalog versions, selected tools, ready and needsMoreEquipment.
          content:
            application/json:
              schema:
                type: object
                required: [equipmentCatalogVersion, exerciseCatalogVersion, selectedEquipment, ready, needsMoreEquipment, warnings]
                properties:
                  equipmentCatalogVersion: { $ref: "#/components/schemas/DecimalVersion" }
                  exerciseCatalogVersion: { $ref: "#/components/schemas/DecimalVersion" }
                  selectedEquipment: { type: array, items: { $ref: "#/components/schemas/EquipmentItem" } }
                  ready: { type: array, items: { $ref: "#/components/schemas/EquipmentExercise" } }
                  needsMoreEquipment: { type: array, items: { $ref: "#/components/schemas/EquipmentExercise" } }
                  warnings: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
  /equipment/recognize:
    post:
      operationId: recognizeEquipmentPhoto
      description: Authenticated photo recognition using a private self-hosted pinned SigLIP 2 service. One photo file only, JPEG/PNG/static WebP, at most 4 MiB and 16 Mi-pixels. Photos remain in memory. All candidates require human confirmation; scores are uncalibrated similarities, not accuracy. Focus on one tool. No photo URL or mobile base64 accepted.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [photo]
              properties:
                photo: { type: string, format: binary, description: JPEG, PNG or static WebP file; 4 MiB limit. }
      responses:
        "200":
          description: Needs-confirmation candidates or unknown with an empty candidate array. No automatic preference writes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EquipmentRecognition" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "408": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /catalog/places:
    get:
      operationId: getPlaceCatalog
      security: []
      description: Public catalog. Initial 18 Jakarta entries researched on 2026-10-11, not on-site verified. Category and access model are independent; null day-pass availability is unknown. See docs/places.md.
      parameters:
        - { $ref: "#/components/parameters/PlacesArea" }
        - { $ref: "#/components/parameters/PlacesCity" }
        - { $ref: "#/components/parameters/PlacesMode" }
        - { $ref: "#/components/parameters/PlacesGymCategory" }
        - { $ref: "#/components/parameters/PlacesBrand" }
        - { $ref: "#/components/parameters/PlacesAccessModel" }
        - { $ref: "#/components/parameters/PlacesDayPass" }
        - { $ref: "#/components/parameters/PlacesLatitude" }
        - { $ref: "#/components/parameters/PlacesLongitude" }
        - { $ref: "#/components/parameters/PlacesRadius" }
        - { $ref: "#/components/parameters/PlacesLimit" }
        - { $ref: "#/components/parameters/PlacesOffset" }
      responses:
        "200":
          description: Versioned active places, access provenance, optional straight-line distances and pagination. Response is no-store.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaceCatalogResponse" }
        "400": { $ref: "#/components/responses/Error" }
  /places:
    get:
      operationId: listPlacesWithFavorites
      description: Same catalog and filters with isFavorite and favoriteVersion for the verified account only. Tombstones are not favorites but their version remains available for re-add. Mutate only the changed place through PUT/DELETE /places/{id}/favorite; legacy sync/push remains supported.
      parameters:
        - { $ref: "#/components/parameters/PlacesArea" }
        - { $ref: "#/components/parameters/PlacesCity" }
        - { $ref: "#/components/parameters/PlacesMode" }
        - { $ref: "#/components/parameters/PlacesGymCategory" }
        - { $ref: "#/components/parameters/PlacesBrand" }
        - { $ref: "#/components/parameters/PlacesAccessModel" }
        - { $ref: "#/components/parameters/PlacesDayPass" }
        - { $ref: "#/components/parameters/PlacesLatitude" }
        - { $ref: "#/components/parameters/PlacesLongitude" }
        - { $ref: "#/components/parameters/PlacesRadius" }
        - { $ref: "#/components/parameters/PlacesLimit" }
        - { $ref: "#/components/parameters/PlacesOffset" }
      responses:
        "200":
          description: Versioned active places, access provenance, optional straight-line distances and pagination. Response is no-store.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaceCatalogResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /catalog/meals:
    get:
      operationId: getMealCatalog
      security: []
      description: Paginated, source-traceable TKPI reference foods, default excluding demos. 1145 usable source foods across 13 groups, each per100g edible portion. All1125 numeric prices are labeled estimates from separate internet references/proxies/cost models, NOT1125 observed individual prices or live offers;20 non-retail/sensitive exclusions remain null with reasons. Always display the estimate label and basis; null is not free. Missing nutrients are null; imputed/borrowed fields remain labeled; flagged micronutrient outliers are withheld. Not independently lab-tested individual foods or dietary recommendations. See docs/food-catalog.md and docs/food-prices.md.
      parameters:
        - name: q
          in: query
          schema: { type: string, minLength: 1, maxLength: 120 }
          description: Literal case-insensitive substring in Indonesian/English name or source code.
        - name: foodGroup
          in: query
          schema: { $ref: "#/components/schemas/FoodGroup" }
        - name: includeDemo
          in: query
          schema: { type: boolean, default: false }
          description: true includes the three legacy demo examples; they remain excluded from nutrition progress.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
      responses:
        "200":
          description: Active meal catalog.
          content:
            application/json:
              schema:
                type: object
                required: [catalogVersion, meals, warning, warnings, total, hasMore, nextOffset]
                properties:
                  catalogVersion: { $ref: "#/components/schemas/DecimalVersion" }
                  warning: { type: string }
                  warnings: { type: array, items: { type: string } }
                  total: { type: integer, minimum: 0 }
                  hasMore: { type: boolean }
                  nextOffset: { type: [integer, "null"], minimum: 0 }
                  meals:
                    type: array
                    items: { $ref: "#/components/schemas/MealCatalogItem" }
        "400": { $ref: "#/components/responses/Error" }
  /nutrition/targets:
    get:
      operationId: getNutritionTargets
      description: Server-stored goal-adjusted estimate for the current live profile/formula version. Bulk approximately +10% capped at +300 kcal; cut approximately -15% capped at -500 kcal; maintenance unchanged. Cut protein 2 g/kg, others 1.6 g/kg. Starting product heuristics, not clinical prescriptions. GET does not write. See docs/meals-nutrition.md for rounding, aliases and safety gates.
      responses:
        "200":
          description: Estimate or explicit profile/rebuild reason; numbers null for incomplete, unsupportedAge or needsReview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionTargets" }
        "401": { $ref: "#/components/responses/Error" }
  /meals:
    $ref: "./openapi-online.json#/paths/~1meals"
  /catalog/programs:
    get:
      operationId: getProgramCatalog
      security: []
      responses:
        "200":
          description: Versioned curated templates with ordered exercise prescriptions.
  /programs/recommendations:
    get:
      operationId: recommendPrograms
      description: Algorithm3 personalizes database templates using saved mode, canonical focusAreas (OR), equipment, goal, age, trainingLevel, ability, bodyweight, health/mobility/recovery context and owned recent history. Standard sessions (at least3 total exercises) precede compact fallbacks. Weekly slots balance distinct focuses first, then prefer less-used/less-recently-completed focuses and variants; canonical order only breaks ties. Rotation counts only owned non-deleted, non-future, completed recommended sessions with known catalog IDs from up to20 sessions in30 days; custom/manual/ambiguous legacy provenance is not focus credit. No new training days from adding focuses. Beginner/intermediate cap3, advanced4, returning after4+ weeks cap2; retain safety guards. Missing trainingLevel remains null in storage, uses conservative prescriptions and is explicitly reported. weeklyPlan is a bounded nonpersisted suggestion, not an ISO calendar or enforcement of total workouts per week. Unscheduled focus remains explicit when slots or candidates are insufficient; no fake coverage/full-body fallback. No nutrition multiplier or strength inference from gender. Missing valid preferences returns409 PREFERENCES_REQUIRED. See docs/program-personalization.md.
      responses:
        "200":
          description: Personalized programs, catalog versions, preferences, personalization metadata, rejectedPrograms and reason. Reasons include AGE_REQUIRED, ADULT_PROGRAMS_ONLY, NO_MATCHING_PROGRAM, PROFESSIONAL_GUIDANCE_REQUIRED, SPECIALIZED_PROGRAM_REQUIRED and RECOVERY_REQUIRED.
          content:
            application/json:
              schema:
                type: object
                required: [programs, preferences, personalization, weeklyPlan, focusCoverage, reason]
                properties:
                  programs:
                    type: array
                    description: Filtered personalized alternatives, unique by ID. Standard/compact is a size label, not proof of physiological completeness. Templates can include core/accessory exercises. Use weeklyPlan references to select sessions, not programs.slice().
                    items: { $ref: "#/components/schemas/RecommendedProgram" }
                  preferences:
                    type: object
                    required: [mode, focus, focusAreas, sessionMinutes, equipment]
                    properties:
                      mode: { type: string, enum: [gym, calisthenics] }
                      focus: { type: [string, "null"], description: Single selection only; null for multiple. }
                      focusAreas: { $ref: "#/components/schemas/FocusAreas" }
                      sessionMinutes: { type: integer }
                      equipment: { type: array, items: { type: string } }
                  personalization:
                    type: object
                    required: [algorithmVersion, trainingLevel, trainingLevelSource, missingProfileFields, requestedWeeklySessions, suggestedWeeklySessions, frequencyCap, frequencyPolicy, selectionPolicy]
                    description: Existing safety metadata remains. Frequency ceilings and ranking are product heuristics, not clinical clearance. A missing level is never persisted as an invented answer.
                    properties:
                      algorithmVersion: { const: "3" }
                      trainingLevel: { type: string, enum: [beginner, intermediate, advanced] }
                      trainingLevelSource: { type: string, enum: [PROFILE, CONSERVATIVE_DEFAULT] }
                      missingProfileFields: { type: array, maxItems: 1, uniqueItems: true, items: { const: trainingLevel } }
                      requestedWeeklySessions: { type: [integer, "null"], minimum: 1, maximum: 7 }
                      suggestedWeeklySessions: { type: integer, minimum: 1, maximum: 4 }
                      frequencyCap: { type: integer, minimum: 2, maximum: 4 }
                      frequencyPolicy: { type: string, enum: [REQUESTED_WITH_LEVEL_CAP, RETURN_TO_TRAINING_CAP] }
                      selectionPolicy: { const: BALANCED_FOCUS_RECENT_HISTORY_VARIATION }
                  weeklyPlan:
                    type: array
                    description: At most suggestedWeeklySessions unique program IDs, balanced across available focus tags before repeating a tag. Standard variants preferred; less-used/less-recent variants rotate after reported completion. May be shorter when candidates run out. Stable for the same data, not random on refresh. Not persisted, no ISO weekdays assigned, no extra days or concatenated prescriptions to force coverage. A fresh response is not a quota subtracting previously completed workouts from a calendar week.
                    items:
                      type: object
                      required: [sessionNumber, programId, focus]
                      properties:
                        sessionNumber: { type: integer, minimum: 1, maximum: 7 }
                        programId: { type: string }
                        focus: { type: string, enum: [full, leg, chest, back, arm] }
                  focusCoverage: { $ref: "#/components/schemas/FocusCoverage" }
                  reason: { type: [string, "null"] }
        "409": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /me:
    $ref: "./openapi-online.json#/paths/~1me"
  /onboarding/complete:
    post:
      operationId: completeOnboarding
      description: Final submission only; no draft, step, or partial-save endpoint. Atomically merges optional profile fields, stores training preferences, marks setup complete, calculates a versioned nutrition estimate and appends two legacy sync changes. Requires current versions from /me. Same account/key/normalized payload replays the original response without writes; different content or a legacy sync operation using that key returns409 IDEMPOTENCY_KEY_REUSE. A completed account rejects a new key with409 ONBOARDING_ALREADY_COMPLETED. Receipts use the existing account-lifecycle retention, with no new TTL. No query parameters; strict JSON at most64KiB. Equipment IDs must be active and support the selected mode at validation time. Ownership comes only from the Bearer JWT.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingCompleteInput" }
      responses:
        "200":
          description: Canonical saved setup and nutrition targets, or exact idempotent replay. Optional missing body/formula data may leave the nutrition estimate unavailable without blocking completion.
          content:
            application/json:
              schema:
                type: object
                required: [operationId, setupCompleted, profile, trainingPreferences, versions, nutritionTargets]
                properties:
                  operationId: { type: string, format: uuid }
                  setupCompleted: { const: true }
                  profile: { $ref: "#/components/schemas/SetupProfile" }
                  trainingPreferences: { $ref: "#/components/schemas/SetupTrainingPreferences" }
                  userPreferences:
                    anyOf: [{ $ref: "./openapi-online.json#/components/schemas/UserPreferences" }, { type: "null" }]
                  versions: { $ref: "#/components/schemas/SetupVersions" }
                  nutritionTargets: { $ref: "#/components/schemas/NutritionTargets" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /sync/bootstrap:
    get:
      operationId: bootstrapSync
      description: Consistent single-response snapshot. Guarded at500 live records per entity type and1.5MB source-row JSON budget; oversized accounts return413 BOOTSTRAP_LIMIT without deleting/truncating data. This legacy contract is not paginated bootstrap; large-account snapshot pagination remains future work.
      responses:
        "200":
          description: Consistent account snapshot and initial signed cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bootstrap"
        "401": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /sync/push:
    post:
      operationId: pushSyncOperations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushRequest"
      responses:
        "200":
          description: Per-operation result. Validation and version conflicts do not fail the batch.
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, results]
                properties:
                  schemaVersion: { const: 1 }
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/OperationResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
  /sync/pull:
    get:
      operationId: pullSyncChanges
      parameters:
        - in: query
          name: cursor
          required: true
          schema: { type: string, maxLength: 2048 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: Ordered page of committed changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullResponse"
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /imports/demo:
    post:
      operationId: importDemoSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schemaVersion, importId, entities]
              properties:
                schemaVersion: { const: 1 }
                importId: { type: string, format: uuid }
                entities:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: "#/components/schemas/ImportEntity" }
      responses:
        "201": { description: Snapshot imported atomically. }
        "200": { description: Identical importId and snapshot was already imported. }
        "409": { $ref: "#/components/responses/Error" }
  /workouts:
    $ref: "./openapi-online.json#/paths/~1workouts"
  /catalog/exercises:
    get:
      operationId: getExerciseCatalog
      security: []
      responses:
        "200":
          description: Public versioned exercise catalog across both modes; after0024 tracking type, nullable rep defaults, time defaults and canonical muscles are included. No mode/profile filter.
          content:
            application/json:
              schema:
                type: object
                required: [catalogVersion, exercises]
                properties:
                  catalogVersion: { type: string }
                  exercises: { type: array, items: { $ref: "#/components/schemas/ExerciseCatalogItem" } }
  /account/deletion-requests:
    post:
      operationId: requestAccountDeletion
      responses:
        "202":
          description: Idempotent request; marks account inactive immediately and schedules deletion after7days. Identical identity may repeat this request or GET own status with a valid unexpired JWT despite inactive state. No extension of deadline on retry. Ordinary private API remains403. Provider identity/sessions must be removed by separate operational worker before application data purge;202 is not completion or a backup-erasure guarantee.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountDeletionStatus" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    get:
      operationId: getOwnDeletionStatus
      description: Current identity only; valid JWT required, including inactive accounts. After provider deletion/JWT expiry/physical purge authentication can fail; this is not a permanently public tracking URL. No userId/query or admin error details accepted/exposed.
      responses:
        "200":
          description: Deletion lifecycle status or status not_requested.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/AccountDeletionStatus" }
                  - { type: object, properties: { status: { const: not_requested } }, required: [status] }
        "401": { $ref: "#/components/responses/Error" }
components:
  parameters:
    PlacesArea:
      in: query
      name: area
      description: Exact case-insensitive region; initial data uses Jakarta.
      schema: { type: string, minLength: 1, maxLength: 120 }
    PlacesCity:
      in: query
      name: city
      description: Exact case-insensitive administrative city, e.g. Jakarta Selatan.
      schema: { type: string, minLength: 1, maxLength: 120 }
    PlacesMode:
      in: query
      name: mode
      description: Calisthenics includes outdoor fitness.
      schema: { type: string, enum: [gym, calisthenics] }
    PlacesGymCategory:
      in: query
      name: gymCategory
      description: Cannot combine with calisthenics mode.
      schema: { type: string, enum: [brand, conventional] }
    PlacesBrand:
      in: query
      name: brand
      description: Case-insensitive key, initially fithub or ftl; gym only.
      schema: { type: string, minLength: 1, maxLength: 80 }
    PlacesAccessModel:
      in: query
      name: accessModel
      description: Exact access model; membership is a primary offer, not proof that day passes are forbidden.
      schema: { type: string, enum: [membership, per_visit, membership_or_per_visit, public, unknown] }
    PlacesDayPass:
      in: query
      name: dayPassAvailable
      description: Explicit true or false. Unknown/null records do not match either value.
      schema: { type: boolean }
    PlacesLatitude:
      in: query
      name: latitude
      description: Request origin; must be paired with longitude. Not stored.
      schema: { type: number, minimum: -90, maximum: 90 }
    PlacesLongitude:
      in: query
      name: longitude
      description: Request origin; must be paired with latitude. Not stored.
      schema: { type: number, minimum: -180, maximum: 180 }
    PlacesRadius:
      in: query
      name: radiusKm
      description: Requires origin coordinates; straight-line radius filtered before pagination.
      schema: { type: number, exclusiveMinimum: 0, maximum: 100 }
    PlacesLimit:
      in: query
      name: limit
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    PlacesOffset:
      in: query
      name: offset
      description: Page offset.
      schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
  securitySchemes:
    nativeSession:
      type: http
      scheme: Session
      description: Opaque encrypted native session envelope from Next.js sign-in. Send Authorization with Session scheme, NOT Bearer. Only auth session/token/sign-out endpoints accept it; no cookies or query tokens.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Structured API error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    NativeAuthSignIn:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
    NativeAuthSignUp:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 120, description: Trimmed; must not be empty. }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
    NativeAuthUser:
      type: object
      required: [id, email, name, emailVerified]
      properties:
        id: { type: string, description: Provider user ID/JWT subject, NOT necessarily the application users.id returned by /me. }
        email: { type: string, format: email }
        name: { type: string }
        emailVerified: { type: boolean }
    NativeAuthSession:
      type: object
      required: [status, user, sessionToken, sessionExpiresAt]
      properties:
        status: { const: authenticated }
        user: { $ref: "#/components/schemas/NativeAuthUser" }
        sessionToken: { type: string, maxLength: 8192, description: Encrypted opaque session. Always atomically replace the previous value; store in OS secure storage; never log or put in URLs. }
        sessionExpiresAt: { type: string, format: date-time, description: Envelope expiry capped at30 days/provider expiry; NOT access JWT expiry. }
    NativeAuthNoSession:
      type: object
      required: [status, user, sessionToken, sessionExpiresAt]
      properties:
        status: { type: string, enum: [verification_required, sign_in_required] }
        user: { $ref: "#/components/schemas/NativeAuthUser" }
        sessionToken: { type: "null" }
        sessionExpiresAt: { type: "null" }
    NativeAuthTokens:
      allOf:
        - { $ref: "#/components/schemas/NativeAuthSession" }
        - type: object
          required: [accessToken, tokenType]
          properties:
            accessToken: { type: string, maxLength: 8192, description: Verified short-lived provider JWT for Authorization Bearer on private data endpoints. }
            tokenType: { const: Bearer }
    SyncSnapshotMetadata:
      type: object
      required: [schemaVersion, snapshotId, total, expiresAt]
      properties:
        schemaVersion: { const: 2 }
        snapshotId: { type: string, format: uuid }
        total: { type: integer, minimum: 0, maximum: 20000 }
        expiresAt: { type: string, format: date-time }
    SyncSnapshotPage:
      allOf:
        - { $ref: "#/components/schemas/SyncSnapshotMetadata" }
        - type: object
          required: [items, complete, nextPageCursor, syncCursor]
          properties:
            items:
              type: array
              maxItems: 100
              items:
                allOf:
                  - { $ref: "#/components/schemas/SnapshotItem" }
                  - type: object
                    required: [entityType]
                    properties:
                      entityType: { $ref: "#/components/schemas/EntityType" }
            complete: { type: boolean }
            nextPageCursor: { type: [string, "null"] }
            syncCursor: { type: [string, "null"], description: Non-null only on complete snapshot. Compatible with existing /sync/pull schemaVersion1. }
    AccountDeletionStatus:
      type: object
      required: [status, deletionRequestId, processingStatus, requestedAt, deleteAfter, completedAt, waitDays]
      properties:
        status: { type: string, enum: [deletion_requested, completed] }
        deletionRequestId: { type: string, format: uuid, description: Lifecycle receipt ID, distinct from HTTP X-Request-ID. }
        processingStatus: { type: string, enum: [waiting, provider_pending, failed, completed] }
        requestedAt: { type: string, format: date-time }
        deleteAfter: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        waitDays: { const: 7 }
    CommunityPost:
      type: object
      required: [postId, authorLabel, body, createdAt, isMine]
      properties:
        postId: { type: string, format: uuid }
        authorLabel: { type: string, maxLength: 80 }
        body: { type: string, maxLength: 2000 }
        createdAt: { type: string, format: date-time }
        isMine: { type: boolean }
    EquipmentItem:
      type: object
      required: [id, name, aliases, modes]
      properties:
        id: { type: string, pattern: "^[a-z][a-z0-9_]{0,79}$" }
        name: { type: string }
        aliases: { type: array, items: { type: string } }
        modes:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { type: string, enum: [gym, calisthenics] }
          description: Training taxonomy; shared equipment uses [gym, calisthenics]. Not a location or individualized exercise recommendation.
    ExerciseCatalogItem:
      type: object
      required: [id, mode, idLabel, enLabel, defaultSets, defaultReps, requirements, trackingType, defaultDurationSeconds, muscleTargets]
      properties:
        id: { type: string }
        mode: { type: string, enum: [gym, calisthenics] }
        idLabel: { type: string }
        enLabel: { type: string }
        defaultSets: { type: integer, minimum: 1, maximum: 10 }
        defaultReps: { type: [integer, "null"], minimum: 1, maximum: 100 }
        requirements: { type: array, items: { type: array, items: { type: string } } }
        trackingType: { type: string, enum: [repetitions, duration] }
        defaultDurationSeconds: { type: [integer, "null"], minimum: 1, maximum: 3600 }
        muscleTargets: { anyOf: [{ $ref: "./openapi-online.json#/components/schemas/MuscleTargets" }, { type: "null" }] }
    EquipmentExercise:
      type: object
      required: [id, mode, idLabel, enLabel, defaultSets, defaultReps, requirements, missingEquipmentOptions]
      properties:
        id: { type: string }
        mode: { type: string, enum: [gym, calisthenics] }
        idLabel: { type: string }
        enLabel: { type: string }
        defaultSets: { type: integer }
        defaultReps: { type: [integer, "null"] }
        trackingType: { type: string, enum: [repetitions, duration] }
        defaultDurationSeconds: { type: [integer, "null"], minimum: 1, maximum: 3600 }
        muscleTargets: { anyOf: [{ $ref: "./openapi-online.json#/components/schemas/MuscleTargets" }, { type: "null" }] }
        requirements:
          type: array
          items: { type: array, items: { type: string } }
        missingEquipmentOptions:
          type: array
          description: Empty for ready; otherwise alternative minimal sets of additional equipment IDs.
          items: { type: array, items: { type: string } }
    EquipmentRecognition:
      type: object
      required: [modelId, modelRevision, status, candidates, equipmentCatalogVersion, requiresConfirmation, warnings]
      properties:
        modelId: { const: google/siglip2-base-patch16-224 }
        modelRevision: { const: 75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2 }
        status: { type: string, enum: [needs_confirmation, unknown] }
        candidates:
          type: array
          maxItems: 3
          items:
            allOf:
              - { $ref: "#/components/schemas/EquipmentItem" }
              - type: object
                required: [score]
                properties:
                  score: { type: number, minimum: 0, maximum: 1, description: Similarity score; NOT calibrated recognition accuracy. }
        equipmentCatalogVersion: { $ref: "#/components/schemas/DecimalVersion" }
        requiresConfirmation: { const: true }
        warnings: { type: array, items: { type: string } }
    PlaceCatalogResponse:
      type: object
      required: [catalogVersion, places, total, hasMore, nextOffset, distanceType, warnings]
      properties:
        catalogVersion: { $ref: "#/components/schemas/DecimalVersion" }
        places:
          type: array
          items: { $ref: "#/components/schemas/PlaceCatalogItem" }
        total: { type: integer, minimum: 0, description: Total filtered rows before pagination. }
        hasMore: { type: boolean }
        nextOffset: { type: [integer, "null"] }
        distanceType: { type: [string, "null"], enum: [straight_line, null] }
        warnings: { type: array, items: { type: string } }
    PlaceCatalogItem:
      type: object
      required: [id, name, mode, gymCategory, brand, accessModel, dayPassAvailable, area, city, address, latitude, longitude, googleMapsUrl, sources, checkedAt, active, version, updatedAt, distanceKm]
      properties:
        id: { type: string, maxLength: 255 }
        name: { type: string }
        mode: { type: string, enum: [gym, calisthenics] }
        gymCategory: { type: [string, "null"], enum: [brand, conventional, null] }
        brand: { type: [string, "null"] }
        accessModel: { type: string, enum: [membership, per_visit, membership_or_per_visit, public, unknown] }
        dayPassAvailable: { type: [boolean, "null"], description: Null means unknown, not unavailable. }
        area: { type: string }
        city: { type: string }
        address: { type: string }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        googleMapsUrl: { type: string, format: uri }
        sources:
          type: array
          minItems: 1
          items:
            type: object
            required: [url, kind, fields]
            properties:
              url: { type: string, format: uri }
              kind: { type: string, enum: [operator, publisher, map, community] }
              fields: { type: array, items: { type: string, enum: [identity, location, access] } }
        checkedAt: { type: string, format: date, description: Web research date, not on-site verification. }
        active: { type: boolean }
        version: { $ref: "#/components/schemas/DecimalVersion" }
        updatedAt: { type: string, format: date-time }
        distanceKm: { type: [number, "null"], description: Great-circle distance rounded to 0.001 km; null without origin. Not travel distance. }
        isFavorite: { type: boolean, description: Present only on the private /places response. }
        favoriteVersion: { $ref: "#/components/schemas/DecimalVersion", description: Private /places only. Includes tombstone version for optimistic favorite mutations; zero if no row. }
    MealNutrients:
      type: object
      additionalProperties: false
      required: [caloriesKcal, proteinGrams]
      properties:
        caloriesKcal: { type: number, minimum: 0 }
        proteinGrams: { type: number, minimum: 0 }
        carbohydrateGrams: { type: [number, "null"], minimum: 0 }
        fatGrams: { type: [number, "null"], minimum: 0 }
        fiberGrams: { type: [number, "null"], minimum: 0, description: TKPI does not distinguish fiber methods per food. }
        sodiumMg: { type: [number, "null"], minimum: 0 }
    FoodGroup:
      type: string
      enum: [cereals, tubers, legumes, vegetables, fruits, meat_poultry, fish_seafood, eggs, dairy, fats_oils, sugars_confectionery, condiments, beverages]
    FoodSourceDetails:
      type: object
      required: [dataset, pdfPage, printedPage, originalReference, ediblePercent, imputedOrBorrowedFields, additionalNutrients, withheldNutrients]
      properties:
        dataset: { type: string, example: TKPI_2017 }
        pdfPage: { type: integer, minimum: 1, description: 1-based page in the pinned source PDF. }
        printedPage: { type: integer, minimum: 1 }
        originalReference: { type: string, description: Original SUMBER column, not a claim that all values were analyzed by that source. }
        ediblePercent: { type: [number, "null"], minimum: 0, maximum: 100 }
        imputedOrBorrowedFields:
          type: array
          items: { type: string }
          description: Source blue-shaded nutrient cells. Other values are not necessarily lab analyzed either.
        additionalNutrients:
          type: object
          additionalProperties: { type: [number, "null"], minimum: 0 }
          description: Per100g edible portion, not log totals. Field names specify Grams/Mg/Mcg. Missing or withheld amounts are null.
        withheldNutrients:
          type: object
          description: Source outliers held for editorial review, not medical thresholds or guessed corrections.
          additionalProperties:
            type: object
            required: [sourceValue, reason]
            properties:
              sourceValue: { type: number }
              reason: { type: string, enum: [SOURCE_OUTLIER_REQUIRES_REVIEW] }
    FoodPriceReference:
      type: object
      additionalProperties: false
      required: [id, productName, sourceName, sourceUrl, location, checkedAt, sourceDate, access, priceRupiah, quantity, unit, edibleBasis, note]
      properties:
        id: { type: string }
        productName: { type: string, description: Actual quoted product and selected package, not necessarily the TKPI food's individual price. }
        sourceName: { type: string }
        sourceUrl: { type: string, format: uri }
        location: { type: string, description: Known seller/market location or explicitly unspecified/default storefront. Not inferred to be the user's city. }
        checkedAt: { type: string, format: date }
        sourceDate: { type: [string, "null"], format: date, description: Date stated by source; null means unstated, not today's measured price. }
        access: { type: string, enum: [live_page, search_index, historical_document] }
        priceRupiah: { type: integer, exclusiveMinimum: 0, description: Observed price of the reference quantity, not the normalized catalog price. }
        quantity: { type: number, exclusiveMinimum: 0 }
        unit: { type: string, enum: [g, ml] }
        edibleBasis: { type: string, enum: [edible, as_purchased] }
        note: { type: string, description: Variant, promotion, weight midpoint, inconsistent index or historical-source caveats. }
    FoodPriceCalculation:
      type: object
      additionalProperties: false
      required: [sourceWeightGrams, densityGramsPerMl, edibleFraction, cookedYieldFactor, cookingCostRupiahPer100g, roundingRupiah]
      properties:
        sourceWeightGrams: { type: number, exclusiveMinimum: 0 }
        densityGramsPerMl: { type: [number, "null"], exclusiveMinimum: 0, description: Explicit assumed density when converting ml; not a measurement. }
        edibleFraction: { type: number, exclusiveMinimum: 0, maximum: 1 }
        cookedYieldFactor: { type: number, exclusiveMinimum: 0, description: Assumed output/input mass ratio in ingredient models;1 otherwise. }
        cookingCostRupiahPer100g: { type: integer, minimum: 0, description: Heuristic additional cost, not an observed restaurant markup. }
        roundingRupiah: { const: 100 }
    FoodPriceDetails:
      type: object
      additionalProperties: false
      required: [status, label, currency, basisGrams, methodVersion, checkedAt, reference, calculation, assumptions]
      description: Independent of TKPI nutrient verification. All numeric catalog prices are estimates per100g edible portion. Source/proxy differences and cost assumptions must not be hidden. Low confidence proxies do not guarantee a shopping budget.
      properties:
        status: { type: string, enum: [estimated, not_priced] }
        label: { type: string, enum: ["Estimasi harga, bukan harga jual pasti", "Tidak diberi estimasi harga"] }
        currency: { const: IDR }
        basisGrams: { const: 100 }
        methodVersion: { const: internet-reference-estimates-v1 }
        checkedAt: { type: string, format: date, description: Source review date, not an assertion that an undated/historical offer is current. }
        method: { type: string, enum: [reference_conversion, similar_food_proxy, category_proxy, ingredient_cost_model] }
        confidence: { type: string, enum: [medium, low], description: Editorial matching confidence, not a probability or statistical interval. }
        reasonCode: { type: string, enum: [NOT_A_RETAIL_FOOD, SENSITIVE_FOOD_REQUIRES_REVIEW] }
        reference:
          oneOf: [{ $ref: "#/components/schemas/FoodPriceReference" }, { type: "null" }]
        calculation:
          oneOf: [{ $ref: "#/components/schemas/FoodPriceCalculation" }, { type: "null" }]
        assumptions:
          type: array
          minItems: 1
          items: { type: string }
      oneOf:
        - required: [method, confidence]
          properties:
            status: { const: estimated }
            label: { const: "Estimasi harga, bukan harga jual pasti" }
            reference: { $ref: "#/components/schemas/FoodPriceReference" }
            calculation: { $ref: "#/components/schemas/FoodPriceCalculation" }
          not: { required: [reasonCode] }
        - required: [reasonCode]
          properties:
            status: { const: not_priced }
            label: { const: "Tidak diberi estimasi harga" }
            reference: { type: "null" }
            calculation: { type: "null" }
          not:
            anyOf: [{ required: [method] }, { required: [confidence] }]
    MealCatalogItem:
      type: object
      required: [id, idLabel, enLabel, portionGrams, foodGroup, caloriesKcal, proteinGrams, carbohydrateGrams, fatGrams, fiberGrams, sodiumMg, sourceType, sourceNote, sourceUrl, sourceCode, sourceCheckedAt, sourceDetails, samplePriceRupiah, priceDetails, active, version, updatedAt]
      properties:
        id: { type: string }
        idLabel: { type: string }
        enLabel: { type: [string, "null"], description: Only source-provided translations; fallback to idLabel. }
        portionGrams: { type: [number, "null"], exclusiveMinimum: 0, description: 100g edible portion for TKPI; demo gram weights unknown. servings 1.5 therefore means150g, not1.5 plates. }
        foodGroup:
          oneOf: [{ $ref: "#/components/schemas/FoodGroup" }, { type: "null" }]
        caloriesKcal: { type: number, minimum: 0, maximum: 10000 }
        proteinGrams: { type: number, minimum: 0, maximum: 1000 }
        carbohydrateGrams: { type: [number, "null"], minimum: 0, maximum: 1000 }
        fatGrams: { type: [number, "null"], minimum: 0, maximum: 1000 }
        fiberGrams: { type: [number, "null"], minimum: 0, maximum: 1000 }
        sodiumMg: { type: [number, "null"], minimum: 0, maximum: 100000 }
        samplePriceRupiah: { type: [integer, "null"], minimum: 0, description: Estimated per catalog serving100g edible. Not package/plate price or total servings cost. Always display estimate label. Null is not free. Demos remain illustrative. }
        priceDetails:
          oneOf: [{ $ref: "#/components/schemas/FoodPriceDetails" }, { type: "null" }]
        sourceType: { type: string, enum: [demo, reference] }
        sourceNote: { type: string }
        sourceUrl: { type: [string, "null"] }
        sourceCode: { type: [string, "null"], example: AP001 }
        sourceCheckedAt: { type: [string, "null"], format: date }
        sourceDetails:
          oneOf: [{ $ref: "#/components/schemas/FoodSourceDetails" }, { type: "null" }]
        active: { type: boolean }
        version: { $ref: "#/components/schemas/DecimalVersion" }
        updatedAt: { type: string, format: date-time }
    MealEntryPayload:
      type: object
      additionalProperties: false
      required: [menuName, note, samplePriceRupiah, snapshot]
      description: Legacy entries omit all structured fields. Structured entries need servings, consumedAt, recordedOn, mealType and catalogId or per-serving nutrition. Omitted new fields preserve existing values; explicitly null all structured fields to clear. Catalog nutrition is server-authoritative and historical snapshots do not refresh on edits. snapshot.nutritionDetails is server-owned.
      properties:
        menuName: { type: [string, "null"], minLength: 1, maxLength: 120 }
        note: { type: [string, "null"], maxLength: 2000 }
        samplePriceRupiah: { type: [integer, "null"], minimum: 0 }
        snapshot: { type: object, additionalProperties: true }
        catalogId: { type: [string, "null"], minLength: 1, maxLength: 255 }
        servings: { type: [number, "null"], minimum: 0.01, maximum: 20, multipleOf: 0.01 }
        consumedAt: { type: [string, "null"], format: date-time }
        recordedOn: { type: [string, "null"], format: date }
        mealType: { type: [string, "null"], enum: [breakfast, lunch, dinner, snack, null] }
        nutrition:
          description: Per serving, not total. Required for custom meals. Catalog values overwrite client values.
          anyOf:
            - type: object
              additionalProperties: false
              required: [caloriesKcal, proteinGrams]
              properties:
                caloriesKcal: { type: number, minimum: 0, maximum: 10000 }
                proteinGrams: { type: number, minimum: 0, maximum: 1000 }
                carbohydrateGrams: { type: [number, "null"], minimum: 0, maximum: 1000 }
                fatGrams: { type: [number, "null"], minimum: 0, maximum: 1000 }
                fiberGrams: { type: [number, "null"], minimum: 0, maximum: 1000 }
                sodiumMg: { type: [number, "null"], minimum: 0, maximum: 100000 }
            - { type: "null" }
    MealLogItem:
      type: object
      required: [id, menuName, note, samplePriceRupiah, snapshot, catalogId, servings, consumedAt, recordedOn, mealType, nutritionPerServing, caloriesKcal, proteinGrams, version, updatedAt]
      properties:
        id: { type: string }
        menuName: { type: [string, "null"] }
        note: { type: [string, "null"] }
        samplePriceRupiah: { type: [integer, "null"] }
        snapshot: { type: object }
        catalogId: { type: [string, "null"] }
        servings: { type: [number, "null"] }
        consumedAt: { type: [string, "null"], format: date-time }
        recordedOn: { type: [string, "null"], format: date }
        mealType: { type: [string, "null"] }
        nutritionPerServing:
          anyOf:
            - { $ref: "#/components/schemas/MealNutrients" }
            - { type: "null" }
        caloriesKcal: { type: [number, "null"] }
        proteinGrams: { type: [number, "null"] }
        version: { $ref: "#/components/schemas/DecimalVersion" }
        updatedAt: { type: string, format: date-time }
    NutritionTargets:
      type: object
      required: [formulaVersion, profileVersion, estimate, reason, caloriePolicy, goalAdjustmentApplied, activityFactors, goalPolicies, cutGuards, sources, warnings]
      properties:
        formulaVersion: { const: mifflin-pal-goals-v2 }
        profileVersion: { type: [string, "null"] }
        caloriePolicy: { const: goal_adjusted_v2 }
        goalAdjustmentApplied: { type: boolean, description: True only for ready nonzero calorie adjustment. }
        goalPolicies:
          type: object
          required: [bulk, cut, maintenance]
          additionalProperties:
            type: object
            properties:
              calorieRatio: { type: number }
              maxAdjustmentKcal: { type: integer }
              proteinFactor: { type: number }
              proteinMinFactor: { type: number }
              proteinMaxFactor: { type: number }
        cutGuards:
          type: object
          properties:
            minimumTargetKcal: { const: 1500 }
            minimumBmi: { const: 20 }
        reason: { type: [string, "null"], enum: [PROFILE_REQUIRED, ESTIMATE_REBUILD_REQUIRED, null] }
        activityFactors:
          type: object
          properties:
            light: { const: 1.55 }
            moderate: { const: 1.85 }
            vigorous: { const: 2.2 }
        sources:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              url: { type: string, format: uri }
        warnings: { type: array, items: { type: string } }
        estimate:
          anyOf:
            - type: "null"
            - type: object
              required: [status, reasonCodes, restingKcal, calories, proteinGrams, proteinMin, proteinMax, normalizedGoal, maintenanceCalories, calorieAdjustmentKcal, proteinFactor, inputSnapshot, calculatedAt]
              properties:
                status: { type: string, enum: [ready, incomplete, unsupportedAge, needsReview] }
                reasonCodes: { type: array, items: { type: string } }
                restingKcal: { type: [number, "null"] }
                calories: { type: [integer, "null"], description: Final goal-adjusted daily target; do not apply another adjustment on the client. }
                normalizedGoal: { type: [string, "null"], enum: [bulk, cut, maintenance, null] }
                maintenanceCalories: { type: [integer, "null"] }
                calorieAdjustmentKcal: { type: [integer, "null"], minimum: -500, maximum: 300 }
                proteinFactor: { type: [number, "null"] }
                proteinGrams: { type: [integer, "null"] }
                proteinMin: { type: [integer, "null"] }
                proteinMax: { type: [integer, "null"] }
                inputSnapshot: { type: object }
                calculatedAt: { type: string, format: date-time }
    DecimalVersion:
      type: string
      pattern: "^(0|[1-9][0-9]*)$"
      description: PostgreSQL bigint serialized as a decimal string.
    SetupVersions:
      type: object
      additionalProperties: false
      required: [profile, trainingPreferences]
      description: Current row versions, including tombstones. Zero means no row. Range0..9223372036854775807, never JSON numbers.
      properties:
        profile: { $ref: "#/components/schemas/DecimalVersion", maxLength: 19 }
        trainingPreferences: { $ref: "#/components/schemas/DecimalVersion", maxLength: 19 }
        userPreferences: { $ref: "#/components/schemas/DecimalVersion", maxLength: 19, description: Returned by /me and complete; optional in onboarding input and not checked/written by onboarding. Required as base version when PATCH changes userPreferences. }
    TrainingContext:
      type: object
      additionalProperties: false
      properties:
        pregnancyStatus: { type: [string, "null"], enum: [not_applicable, not_pregnant, pregnant, postpartum, prefer_not_to_say, null] }
        healthStatus: { type: [string, "null"], enum: [no_known_restrictions, needs_professional_guidance, prefer_not_to_say, null] }
        painAreas: { type: array, maxItems: 7, items: { type: string, enum: [shoulder, elbow, wrist, back, hip, knee, ankle] } }
        mobilityLimitations: { type: array, maxItems: 3, items: { type: string, enum: [floor_transfer, overhead_reach, deep_knee_bend] } }
        balanceConfidence: { type: [string, "null"], enum: [stable, needs_support, null] }
        recoveryStatus: { type: [string, "null"], enum: [recovered, tired, very_tired, null] }
        trainingBreakWeeks: { type: [integer, "null"], minimum: 0, maximum: 520 }
        equipmentHeightLimits:
          type: array
          maxItems: 50
          description: Unique equipment IDs; minHeightCm must not exceed maxHeightCm.
          items:
            type: object
            additionalProperties: false
            required: [equipment, minHeightCm, maxHeightCm]
            properties:
              equipment: { type: string, minLength: 1, maxLength: 80 }
              minHeightCm: { type: number, minimum: 1, maximum: 300 }
              maxHeightCm: { type: number, minimum: 1, maximum: 300 }
    ExerciseCapability:
      type: object
      additionalProperties: false
      required: [exerciseId, mode, maxReps, weightKg]
      properties:
        exerciseId: { type: string, minLength: 1, maxLength: 255 }
        mode: { type: string, enum: [gym, calisthenics] }
        maxReps: { type: [integer, "null"], minimum: 0, maximum: 100 }
        trackingType: { type: string, enum: [repetitions, duration] }
        maxDurationSeconds: { type: [integer, "null"], minimum: 0, maximum: 3600 }
        weightKg: { type: [number, "null"], minimum: 0, maximum: 500 }
        bodyweightKg: { type: [number, "null"], exclusiveMinimum: 0, maximum: 9999.99 }
      if:
        required: [trackingType]
        properties:
          trackingType: { const: duration }
      then:
        required: [maxDurationSeconds]
        properties:
          maxReps: { type: "null" }
          maxDurationSeconds: { type: integer, minimum: 0, maximum: 3600 }
      else:
        properties:
          maxReps: { type: integer, minimum: 0, maximum: 100 }
          maxDurationSeconds: { type: "null" }
    RecommendedProgram:
      type: object
      required: [id, name, mode, focus, durationMinutes, exercises, restSeconds, suggestedWeeklySessions, adjustments, recommendationTier]
      properties:
        id: { type: string, minLength: 1, maxLength: 255 }
        name: { type: string }
        mode: { type: string, enum: [gym, calisthenics] }
        focus: { type: string, enum: [full, leg, chest, back, arm] }
        durationMinutes: { type: integer, minimum: 1, description: Estimated from the personalized prescription, not the maximum user budget. }
        exercises:
          type: array
          minItems: 1
          items: { $ref: "./openapi-online.json#/components/schemas/ExercisePrescription" }
        restSeconds: { type: integer, minimum: 1 }
        suggestedWeeklySessions: { type: integer, minimum: 1, maximum: 4 }
        recommendationTier: { type: string, enum: [standard, compact], description: standard means at least3 total exercises; compact has1–2. Both still require every safety/equipment/duration filter. }
        adjustments:
          type: array
          items:
            type: object
            required: [originalExerciseId, exerciseId, source]
            properties:
              originalExerciseId: { type: string }
              exerciseId: { type: string }
              source: { type: string, enum: [SELF_ASSESSMENT, RECENT_WORKOUT, CONSERVATIVE_START] }
    FocusAreas:
      type: array
      maxItems: 4
      uniqueItems: true
      description: Canonical order full, leg, chest, back, arm, not priority. full is exclusive. Empty only for custom source on new onboarding or source/focus edits; null is rejected. Omitted PATCH preserves the current selection. Legacy completed profiles lacking a selection may still edit unrelated fields.
      items: { type: string, enum: [full, leg, chest, back, arm] }
      if:
        contains: { const: full }
      then:
        maxItems: 1
    FocusInputCompatibility:
      description: Requests with both fields must be equivalent single selections or focus null plus an empty array. For multi-select send focusAreas only; do not echo the legacy response focus null alongside it.
      if:
        required: [focus, focusAreas]
      then:
        anyOf:
          - properties:
              focus: { type: "null" }
              focusAreas: { maxItems: 0 }
          - properties:
              focus: { const: full }
              focusAreas: { const: [full] }
          - properties:
              focus: { const: leg }
              focusAreas: { const: [leg] }
          - properties:
              focus: { const: chest }
              focusAreas: { const: [chest] }
          - properties:
              focus: { const: back }
              focusAreas: { const: [back] }
          - properties:
              focus: { const: arm }
              focusAreas: { const: [arm] }
    FocusCoverage:
      type: object
      required: [requested, available, unavailable, scheduled, unscheduled, unfilledSessions]
      description: Coverage of program catalog focus tags after all safety/ability/equipment/time filters; not a physiological guarantee that every muscle is trained. Unscheduled includes both unavailable focuses and those beyond the bounded weekly suggestion. Canonical ordering resolves ties, not user priority.
      properties:
        requested: { $ref: "#/components/schemas/FocusAreas" }
        available: { $ref: "#/components/schemas/FocusAreas" }
        unavailable: { $ref: "#/components/schemas/FocusAreas" }
        scheduled: { $ref: "#/components/schemas/FocusAreas" }
        unscheduled: { $ref: "#/components/schemas/FocusAreas" }
        unfilledSessions: { type: integer, minimum: 0, maximum: 7 }
    OnboardingProfile:
      type: object
      additionalProperties: false
      required: [ageYears, goal, dailyActivity, trainingFrequency, sessionMinutes, programSource, motivationEnabled, motivationReason]
      description: Final setup values. App source requires nonempty focusAreas or a valid legacy focus. Custom source permits an empty array or omission. Both fields must agree if sent together. Omitted optional fields preserve existing values; explicit null clears nullable fields except focusAreas which never accepts null. trainingContext objects merge provided keys; null clears the whole context. setupCompleted is server-owned and rejected in requests. Gender never implies formulaSex or ability.
      allOf:
        - $ref: "#/components/schemas/FocusInputCompatibility"
      properties:
        ageYears: { type: integer, minimum: 1, maximum: 150 }
        goal: { type: string, enum: [bulk, cut, maintenance, maintain], description: maintain is accepted and normalized to maintenance. }
        dailyActivity: { type: string, enum: [light, moderate, vigorous] }
        trainingFrequency: { type: integer, minimum: 1, maximum: 7 }
        sessionMinutes: { type: integer, minimum: 10, maximum: 180 }
        programSource: { type: string, enum: [app, custom] }
        motivationEnabled: { type: boolean }
        motivationReason: { type: string, minLength: 1, maxLength: 80 }
        focus: { type: [string, "null"], enum: [full, leg, chest, back, arm, null] }
        focusAreas: { $ref: "#/components/schemas/FocusAreas" }
        displayName: { type: [string, "null"], minLength: 1, maxLength: 80 }
        weightKg: { type: [number, "null"], exclusiveMinimum: 0, maximum: 9999.99 }
        heightCm: { type: [number, "null"], exclusiveMinimum: 0, maximum: 999.99 }
        formulaSex: { type: [string, "null"], enum: [male, female, null] }
        gender: { type: [string, "null"], enum: [male, female, non_binary, self_described, prefer_not_to_say, null] }
        trainingLevel: { type: [string, "null"], enum: [beginner, intermediate, advanced, null], description: New mobile forms should send the users explicit choice. Optional for legacy compatibility; omission preserves an existing value. Missing stays null in storage and is reported as a conservative assumption in recommendations. }
        trainingContext:
          oneOf: [{ $ref: "#/components/schemas/TrainingContext" }, { type: "null" }]
        exerciseCapabilities:
          type: [array, "null"]
          maxItems: 100
          description: Unique mode/exerciseId pairs, based on actual user assessments.
          items: { $ref: "#/components/schemas/ExerciseCapability" }
        excludedExerciseIds: { type: [array, "null"], maxItems: 100, items: { type: string, minLength: 1, maxLength: 255 } }
      if:
        properties:
          programSource: { const: app }
        required: [programSource]
      then:
        anyOf:
          - required: [focusAreas]
            properties:
              focusAreas: { minItems: 1 }
          - required: [focus]
            properties:
              focus: { type: string, enum: [full, leg, chest, back, arm] }
    OnboardingTrainingPreferences:
      type: object
      additionalProperties: false
      required: [mode, equipment, noEquipment]
      properties:
        mode: { type: string, enum: [gym, calisthenics] }
        equipment:
          type: array
          maxItems: 50
          uniqueItems: true
          items: { type: string, pattern: "^[a-z][a-z0-9_]{0,79}$" }
        noEquipment: { type: boolean }
      if:
        properties:
          noEquipment: { const: true }
        required: [noEquipment]
      then:
        properties:
          equipment: { maxItems: 0 }
      else:
        properties:
          equipment: { minItems: 1 }
    OnboardingCompleteInput:
      type: object
      additionalProperties: false
      required: [baseVersions, profile, trainingPreferences]
      properties:
        baseVersions: { $ref: "#/components/schemas/SetupVersions" }
        profile: { $ref: "#/components/schemas/OnboardingProfile" }
        trainingPreferences: { $ref: "#/components/schemas/OnboardingTrainingPreferences" }
    SetupProfile:
      type: object
      required: [displayName, ageYears, weightKg, heightCm, formulaSex, gender, trainingContext, goal, motivationReason, motivationEnabled, dailyActivity, trainingFrequency, focus, focusAreas, programSource, sessionMinutes, setupCompleted, trainingLevel, exerciseCapabilities, excludedExerciseIds, version, updatedAt]
      description: Canonical current profile; focusAreas is authoritative, including empty for unknown legacy focus. Legacy focus is a singleton projection or null for multiple/empty. No profile remains null; reads do not create it. Pre-upgrade idempotency receipts replay the original JSON and may lack focusAreas; derive only a known singleton in such an ACK until the next ordinary read. Owner ID and tombstone metadata are not exposed. Optional absent measurements are null, never invented.
      properties:
        displayName: { type: [string, "null"] }
        ageYears: { type: [integer, "null"] }
        weightKg: { type: [number, "null"] }
        heightCm: { type: [number, "null"] }
        formulaSex: { type: [string, "null"] }
        gender: { type: [string, "null"] }
        trainingContext:
          oneOf: [{ $ref: "#/components/schemas/TrainingContext" }, { type: "null" }]
        goal: { type: [string, "null"] }
        motivationReason: { type: [string, "null"] }
        motivationEnabled: { type: boolean }
        dailyActivity: { type: [string, "null"] }
        trainingFrequency: { type: [integer, "null"] }
        focus: { type: [string, "null"] }
        focusAreas: { $ref: "#/components/schemas/FocusAreas" }
        programSource: { type: [string, "null"] }
        sessionMinutes: { type: [integer, "null"] }
        setupCompleted: { type: boolean }
        trainingLevel: { type: [string, "null"] }
        exerciseCapabilities:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/ExerciseCapability" }
        excludedExerciseIds: { type: [array, "null"], items: { type: string } }
        version: { $ref: "#/components/schemas/DecimalVersion" }
        updatedAt: { type: string, format: date-time }
    SetupTrainingPreferences:
      type: object
      required: [mode, equipment, noEquipment, version, updatedAt]
      properties:
        mode: { type: string, enum: [gym, calisthenics] }
        equipment: { type: array, items: { type: string } }
        noEquipment: { type: boolean }
        version: { $ref: "#/components/schemas/DecimalVersion" }
        updatedAt: { type: string, format: date-time }
    EntityType:
      type: string
      enum:
        - profile
        - training_preferences
        - custom_program
        - user_exercise
        - workout_session
        - user_preferences
        - place_favorite
        - meal_entry
        - social_draft
        - legacy_user_metadata
    PushRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, deviceId, operations]
      properties:
        schemaVersion: { const: 1 }
        deviceId: { type: string, minLength: 1, maxLength: 255 }
        operations:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/SyncOperation" }
    SyncOperation:
      type: object
      additionalProperties: false
      required: [operationId, entityType, entityId, action, baseVersion]
      properties:
        operationId: { type: string, format: uuid }
        entityType: { $ref: "#/components/schemas/EntityType" }
        entityId: { type: string, minLength: 1, maxLength: 255 }
        action: { type: string, enum: [upsert, delete] }
        baseVersion: { $ref: "#/components/schemas/DecimalVersion" }
        payload:
          description: Required for upsert and forbidden for delete; shape depends on entityType.
    OperationResult:
      type: object
      required: [operationId, status]
      properties:
        operationId: { type: string, format: uuid }
        status: { type: string, enum: [applied, duplicate, conflict, rejected] }
        entityType: { $ref: "#/components/schemas/EntityType" }
        entityId: { type: string }
        version: { $ref: "#/components/schemas/DecimalVersion" }
        sequence: { $ref: "#/components/schemas/DecimalVersion" }
        result: { type: object }
        conflict: { type: object }
        error: { type: object }
    ImportEntity:
      type: object
      additionalProperties: false
      required: [entityType, entityId, payload]
      properties:
        entityType: { $ref: "#/components/schemas/EntityType" }
        entityId: { type: string, minLength: 1, maxLength: 255 }
        payload: {}
    SnapshotItem:
      type: object
      required: [entityId, version, updatedAt, payload]
      properties:
        entityId: { type: string }
        version: { $ref: "#/components/schemas/DecimalVersion" }
        updatedAt: { type: string, format: date-time }
        payload: {}
    Bootstrap:
      type: object
      required: [schemaVersion, cursor, entities]
      properties:
        schemaVersion: { const: 1 }
        cursor: { type: string }
        entities:
          type: object
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/SnapshotItem" }
    PullResponse:
      type: object
      required: [schemaVersion, changes, hasMore, nextCursor]
      properties:
        schemaVersion: { const: 1 }
        hasMore: { type: boolean }
        nextCursor: { type: string }
        changes:
          type: array
          items:
            type: object
            required: [sequence, entityType, entityId, version, operation, payload]
            properties:
              sequence: { $ref: "#/components/schemas/DecimalVersion" }
              entityType: { $ref: "#/components/schemas/EntityType" }
              entityId: { type: string }
              version: { $ref: "#/components/schemas/DecimalVersion" }
              operation: { type: string, enum: [upsert, delete] }
              payload: {}
    ErrorEnvelope:
      type: object
      required: [error, requestId]
      properties:
        requestId: { type: string }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
